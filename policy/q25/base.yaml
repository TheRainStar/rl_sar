q25:
  dt: 0.005
  decimation: 4
  fixed_kp: [80.0, 80.0, 80.0, 80.0,
             80.0, 80.0, 80.0, 80.0,
             80.0, 80.0, 80.0, 80.0]
  fixed_kd: [3.0, 3.0, 3.0, 3.0,
             3.0, 3.0, 3.0, 3.0,
             3.0, 3.0, 3.0, 3.0]
  num_of_dofs: 12
  wheel_indices: []
  # Isaac runtime order: 4 hips, 4 thighs, 4 calves
  torque_limits: [85.0, 85.0, 85.0, 85.0,
                  85.0, 85.0, 85.0, 85.0,
                  180.0, 180.0, 180.0, 180.0]
  default_dof_pos: [0.0, 0.0, 0.0, 0.0,
                    -0.67, -0.67, -0.67, -0.67,
                    1.3, 1.3, 1.3, 1.3]
  # MuJoCo-calibrated pose that puts the muzzle ray on the target center (az=0):
  # lat≈0.003 m, vert≈0.007 m after 6–12 s hold. Not the training default.
  shooting_stand_dof_pos: [0.0, 0.0, 0.0, 0.0,
                           -0.65, -0.65, -0.90, -0.90,
                           1.236, 1.236, 1.164, 1.164]
  shooting_aim_anchor_dof_pos: [0.0, 0.0, 0.0, 0.0,
                                -0.65, -0.65, -0.90, -0.90,
                                1.236, 1.236, 1.164, 1.164]
  # Runtime default is SIM2SIM (policy closed-loop). These keys are the DEPLOY demo stack
  # used only when launching: rl_sim_mujoco q25 shooting_stability deploy
  # mix=0: hold calibrated aim anchor; shooting_aim_servo closes the loop after [1].
  shooting_sim2sim: 1
  shooting_deploy_stabilize: 1
  shooting_policy_mix: 0.0
  shooting_aim_servo: 1
  shooting_aim_pitch_kp: 0.015
  shooting_aim_pitch_ki: 0.006
  shooting_aim_yaw_kp: 0.020
  shooting_aim_yaw_ki: 0.008
  shooting_aim_pitch_trim_limit: 0.40
  shooting_aim_yaw_trim_limit: 0.30
  # Do not write live free-joint yaw (that rotates the feet with the body).
  shooting_aim_base_yaw_correct: 0
  # Offset target: solve planted-twist joints on a scratch model, PD-track them.
  shooting_planted_twist: 1
  shooting_planted_twist_duration: 1.0
  shooting_leg_thigh_clamp: [-1.10, -0.25]
  shooting_leg_calf_clamp: [0.90, 1.50]
  spawn_z: 0.58
  # Used for open-loop stand AND deploy-stabilize (must stay high or rear legs kneel).
  stand_hold_kp: [200.0, 200.0, 200.0, 200.0,
                  280.0, 280.0, 300.0, 300.0,
                  320.0, 320.0, 360.0, 360.0]
  stand_hold_kd: [6.0, 6.0, 6.0, 6.0,
                  8.0, 8.0, 9.0, 9.0,
                  9.0, 9.0, 10.0, 10.0]
  pre_getup_dof_pos: [0.0, 0.0, 0.0, 0.0,
                      -0.95, -0.95, -0.95, -0.95,
                      1.85, 1.85, 1.85, 1.85]
  shooting_stand_attitude_max_pitch_deg: 30.0
  passive_kp: [80.0, 80.0, 80.0, 80.0,
               100.0, 100.0, 100.0, 100.0,
               120.0, 120.0, 120.0, 120.0]
  getup_pre_duration: 0.5
  getup_duration: 4.0
  getup_joint_tolerance: 0.18
  getup_settle_max_duration: 10.0
  getup_settle_stable_duration: 0.5
  stand_attitude_max_deg: 12.0
  shooting_stand_attitude_max_pitch_deg: 25.0
  stand_gyro_max_deg_s: 25.0
  getup_kp: [140.0, 140.0, 140.0, 140.0,
             220.0, 220.0, 220.0, 220.0,
             280.0, 280.0, 280.0, 280.0]
  getup_kd: [5.0, 5.0, 5.0, 5.0,
             6.0, 6.0, 6.0, 6.0,
             7.0, 7.0, 7.0, 7.0]
  # Isaac Lab Q25 runtime order (policy obs and actions): 4 hips, 4 thighs, 4 calves.
  joint_names: ["FL_hip_joint", "FR_hip_joint", "RL_hip_joint", "RR_hip_joint",
                "FL_thigh_joint", "FR_thigh_joint", "RL_thigh_joint", "RR_thigh_joint",
                "FL_calf_joint", "FR_calf_joint", "RL_calf_joint", "RR_calf_joint"]
  joint_controller_names: ["FL_hip_controller", "FR_hip_controller", "RL_hip_controller", "RR_hip_controller",
                           "FL_thigh_controller", "FR_thigh_controller", "RL_thigh_controller", "RR_thigh_controller",
                           "FL_calf_controller", "FR_calf_controller", "RL_calf_controller", "RR_calf_controller"]
  # Isaac index -> MuJoCo FR/FL/RR/RL sensor&actuator index
  joint_mapping: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
  shooting_stability: true
  # Periodic console + CSV: attitude, ray-target delta, joint torques
  shooting_telemetry: true
  shooting_telemetry_interval: 2.0   # console/CSV print period (seconds)
  shooting_telemetry_csv: true       # policy/q25/shooting_telemetry.csv
